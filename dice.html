<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LANCER Dados</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
        cursor: pointer;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #caption {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%) translateY(8px);
        padding: 6px 14px;
        border-radius: 10px;
        background: rgba(20, 22, 32, 0.82);
        border-left: 4px solid #e2382c;
        color: #fff;
        text-align: center;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.25s, transform 0.25s;
        pointer-events: none;
      }
      #caption.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      #caption .who {
        font-size: 12px;
        opacity: 0.75;
      }
      #caption .result {
        font-size: 18px;
        font-weight: 800;
      }
      /* other players: small framed box at the top of the screen */
      html.boxed body {
        position: relative;
        box-sizing: border-box;
        border: 3px solid #e2382c;
        border-radius: 12px;
        background: rgba(20, 22, 32, 0.82);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      #who-bar {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 4px 10px;
        background: rgba(226, 56, 44, 0.9);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }
      html.boxed #who-bar {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="who-bar"></div>
    <div id="caption"><div class="who"></div><div class="result"></div></div>
    <script type="module" src="/src/dice3d.ts"></script>
  </body>
</html>
