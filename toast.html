<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LANCER Avisos</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
      }
      #list {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        gap: 6px;
        padding: 3px 0;
      }
      .toast {
        box-sizing: border-box;
        max-width: 100%;
        min-height: 56px;
        padding: 7px 16px;
        border-radius: 10px;
        background: rgba(20, 22, 32, 0.88);
        border-left: 4px solid #e2382c;
        color: #fff;
        text-align: center;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        animation: in 0.22s ease-out;
      }
      .toast.SUCCESS {
        border-left-color: #3fb36b;
      }
      .toast.WARNING {
        border-left-color: #f08a24;
      }
      .toast.ERROR {
        border-left-color: #ff4d4d;
      }
      .who {
        font-size: 12px;
        opacity: 0.75;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .text {
        font-size: 16px;
        font-weight: 800;
        line-height: 1.25;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
    </style>
  </head>
  <body>
    <div id="list"></div>
    <script type="module" src="/src/toast.ts"></script>
  </body>
</html>
